[project]
name = "d94-app-ecc"
version = "0.1.0"
description = "External Communication Channel orchestration service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.24,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "py-eureka-client>=0.11,<1",
  "redis>=5,<7",
  "uvicorn[standard]>=0.34,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

